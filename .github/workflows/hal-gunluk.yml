name: Hal fiyatı ajanı

# Her gün iki kez (İstanbul saatiyle 10:10 ve 18:10; GitHub saatleri UTC).
# Pazar akşamki çalışma haftalıktır (3 yıllık geçmiş, haftalık rapor).
# Elle çalıştırmak için: Actions › Hal fiyatı ajanı › Run workflow.
on:
  schedule:
    - cron: "10 7 * * *"
    - cron: "10 15 * * *"
  workflow_dispatch:
    inputs:
      haftalik:
        description: "Haftalık çalışma (3 yıl geçmiş)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hal-ajani
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Çalışma türü
        id: tur
        run: |
          gun=$(TZ=Europe/Istanbul date +%u); saat=$(TZ=Europe/Istanbul date +%H)
          if [ "${{ inputs.haftalik }}" = "true" ] || { [ "$gun" = 7 ] && [ "$saat" -ge 17 ]; }; then
            echo "haftalik=1" >> "$GITHUB_OUTPUT"; echo "Haftalık çalışma"
          else
            echo "haftalik=0" >> "$GITHUB_OUTPUT"; echo "Günlük çalışma"
          fi

      - name: Topla (HaldeFiyat + hal.gov.tr)
        id: topla
        continue-on-error: true
        run: |
          if [ "${{ steps.tur.outputs.haftalik }}" = 1 ]; then GUN=1095; else GUN=400; fi
          node ajan/toplayici-node.js --cikti ham --gun $GUN | tee topla.log
          echo "dosyalar=$(grep '^DOSYALAR=' topla.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: İşle (hal-ajan.js → docs/hal-veri.json)
        id: isle
        continue-on-error: true
        if: steps.topla.outputs.dosyalar != ''
        run: |
          EK=""; [ "${{ steps.tur.outputs.haftalik }}" = 1 ] && EK="--haftalik"
          node ajan/hal-ajan.js --klasor docs $EK --dosya "${{ steps.topla.outputs.dosyalar }}"

      - name: Kaynak yoksa günlüğe yaz
        if: steps.topla.outputs.dosyalar == ''
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)  HATA kaynak · iki kaynak da alınamadı · hal-veri.json değiştirilmedi" >> docs/ajan-gunluk.log

      - name: Kaydet ve yayınla
        if: always()
        run: |
          git config user.name "hal-ajani"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs ham
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -q -m "hal verisi $(TZ=Europe/Istanbul date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3; do git push && exit 0; sleep 5; git pull --rebase -q || true; done
          echo "::error::Veri depoya yazılamadı (git push)"; exit 1

      - name: Sonuç
        run: |
          tail -n 1 docs/ajan-gunluk.log
          if [ "${{ steps.topla.outputs.dosyalar }}" = "" ] || [ "${{ steps.isle.outcome }}" = "failure" ]; then
            echo "::error::Hal verisi bu çalışmada güncellenemedi (ayrıntı docs/ajan-gunluk.log). Uygulama son geçerli veriyi göstermeye devam eder."
            exit 1
          fi
          if grep -q "kaynak hatası" <(tail -n 1 docs/ajan-gunluk.log); then
            echo "::warning::Kaynaklardan biri alınamadı; diğeriyle güncellendi."
          fi
